[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsignnet"
version = "1.0.0"
description = "GTSRB traffic sign classification aligned with Kanishkar B's DLCV report"
requires-python = ">=3.11,<3.14"
dependencies = [
  "tensorflow==2.20.0", "opencv-python-headless==4.12.0.88", "numpy==2.2.6",
  "scikit-learn==1.7.2", "pandas==2.3.3", "matplotlib==3.10.7",
  "Pillow==11.3.0", "streamlit==1.50.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.setuptools.packages.find]
include = ["roadsignnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = ["third_party"]

[tool.ruff.lint]
ignore = ["E402"]
